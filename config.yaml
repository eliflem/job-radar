# Job Radar configuration
# Hard filters live here. Language / location judgment happens in the daily Claude review.

# How far back each daily run looks (overlap with yesterday is fine: dedupe handles it)
hours_old: 48

# --- Job boards via JobSpy (LinkedIn, Indeed, Google Jobs) ---
search_terms:
  - "product manager"
  - "senior product manager"
  - "technical product manager"
  - "AI product manager"
  - "data product manager"
  - "product owner"
  - "founding product manager"
  - "entrepreneur in residence"
  - "venture builder"
  - "founder associate"
  - "chief of staff"
  - "technical project manager"
  - "product operations"

# Each search runs once per location below
board_locations:
  - name: "Berlin, Germany"     # hybrid / on-site / remote at Berlin companies
    remote_only: false
  - name: "Germany"             # remote roles anywhere in Germany
    remote_only: true
  - name: "European Union"      # remote roles in Europe
    remote_only: true
  - name: "Worldwide"           # fully remote, anywhere
    remote_only: true

results_per_search: 40
sites: ["linkedin", "indeed", "google"]

# --- Bundesagentur für Arbeit Jobbörse ---
arbeitsagentur:
  enabled: true
  searches:
    - { was: "Product Manager", wo: "Berlin", umkreis: 25 }
    - { was: "Product Owner", wo: "Berlin", umkreis: 25 }
    - { was: "Produktmanager", wo: "Berlin", umkreis: 25 }
    - { was: "Product Manager", wo: "Deutschland", homeoffice: true }

# --- Title filters (applied to every source) ---
# Regex fragments, matched case-insensitively against the job title
title_include:
  - 'product manager'
  - 'product owner'
  - 'product lead'
  - 'product management'
  - 'founding pm'
  - '\bpm\b'
  - 'entrepreneur in residence'
  - '\beir\b'
  - 'venture build'
  - 'founders? associate'
  - 'chief of staff'
  - 'project manager'
  - 'programm?e? manager'
  - 'product op(eration)?s'
  - 'produktmanager'
  - 'product strategist'

title_exclude:
  - '\bintern\b'
  - 'internship'
  - 'werkstudent'
  - 'working student'
  - 'praktik'
  - 'trainee'
  - 'junior'
  - '\bjr\.?\b'
  - 'apprentice'
  - 'ausbildung'
  - 'head of'
  - 'director'
  - '\bvp\b'
  - 'vice president'
  - 'principal'
  - '\bcpo\b'
  - 'construction'
  - '\bbau'
  - 'clinical trial'
  - 'site manager'
  - 'mechanical'

# Companies to never show
excluded_companies:
  - "Babbel"

# --- Company career pages (public ATS feeds) ---
# ats: greenhouse | lever | ashby | personio | smartrecruiters | workable | auto
# slug: the company's board name on that ATS. 'auto' tries every ATS with the slug.
